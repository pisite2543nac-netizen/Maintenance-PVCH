<!doctype html><html lang="th"><meta charset="utf-8"><title>อัพโหลดขึ้น GitHub</title>
<body style="font-family:Tahoma;max-width:560px;margin:30px auto;padding:0 12px">
<h2>อัพโหลดไฟล์ขึ้น GitHub</h2>
<ol><li>แตกไฟล์ zip แล้วเปิดโฟลเดอร์ข้างใน</li><li>กรอกชื่อผู้ใช้และชื่อ repo ด้านล่าง (ต้องสร้าง repo ไว้ก่อน)</li><li>กดปุ่ม แล้วลากไฟล์ทั้งหมดจากในโฟลเดอร์ไปวางในหน้า GitHub → Commit changes</li><li>เปิด Settings → Pages → เลือก branch main / root</li></ol>
<input id=u placeholder="GitHub username" style="width:100%;padding:8px;margin:4px 0"><input id=r placeholder="ชื่อ repository" style="width:100%;padding:8px;margin:4px 0">
<button style="padding:10px 18px" onclick="window.open('https://github.com/'+u.value+'/'+r.value+'/upload/main','_blank')">เปิดหน้าอัพโหลด GitHub</button>
<p><a href="https://github.com/new" target=_blank>สร้าง repo ใหม่</a></p></body></html>
